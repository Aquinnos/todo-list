<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <title>TODO List</title>
  </head>
  <body>
    <div id="myDIV" class="header">
      <h2 style="margin: 5px; color: black">To Do List</h2>
      <div class="input">
        <input type="text" id="inputItem" placeholder="Item 1" />
        <input type="number" name="quantity" id="quantity" />
        <button type="button" class="addBtn" onclick="addItem()">
          Add Item
        </button>
        <button class="addBtn" onclick="searchItems()">Search</button>
        <button class="addBtn" onclick="deleteAllItems()">Delete All</button>
      </div>
    </div>

    <h2 style="text-align: center">List of items</h2>
    <ul
      id="myUL"
      ondrop="dropHandler(event)"
      ondragover="dragoverHandler(event)"
    ></ul>

    <div id="searchModal" class="modal">
      <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h2>Search Results</h2>
        <div class="search-container">
          <input
            type="text"
            id="modalSearchInput"
            placeholder="Search tasks..."
          />
          <!-- <button class="search-btn" onclick="performModalSearch()">
            Search
          </button> -->
        </div>
        <ul id="searchResults"></ul>
      </div>
    </div>

    <div id="editModal" class="modal">
      <div class="modal-content">
        <span class="modal-close" onclick="closeEditModal()">&times;</span>
        <h2>Edit Item</h2>
        <div class="edit-container">
          <input type="text" id="editItemInput" placeholder="Item Name" />
          <input type="number" id="editQuantityInput" placeholder="Quantity" />
          <button class="save-btn" onclick="saveEditedItemModal()">Save</button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
